<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pico Echo Server</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
        }
        #messages .user {
            text-align: left;
            background: #e8e8e8;
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
        }
        #messages .server {
            text-align: right;
            background: #fff;
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        #messages pre {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
        }
        #messages code {
            background: #f5f5f5;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        #messages pre code {
            background: none;
            padding: 0;
        }
        #messages ul, #messages ol {
            margin-left: 20px;
            padding-left: 10px;
        }
        #messages p {
            margin: 4px 0;
        }
        #messages a {
            color: #0066cc;
            text-decoration: underline;
        }
        #messages strong {
            font-weight: 600;
        }
        #messages em {
            font-style: italic;
        }
        #input-area {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        #input {
            flex: 1;
            resize: vertical;
            min-height: 60px;
            padding: 8px;
            font-family: inherit;
        }
        #send {
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.0/lib/marked.umd.min.js"></script>
</head>
<body>
    <h1>Pico Echo Server</h1>
    <p>WebSocket testing interface</p>
    <div id="messages"></div>
    <div id="input-area">
        <textarea id="input" placeholder="Type message..."></textarea>
        <button id="send">Send</button>
    </div>

    <script>
        const wsUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;
        const ws = new WebSocket(wsUrl);

        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        ws.onopen = () => console.log('WebSocket connected');
        ws.onclose = () => console.log('WebSocket disconnected');
        ws.onerror = (e) => console.error('WebSocket error:', e.type);

        ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'message.create') {
                    const content = msg.payload?.content || '';
                    appendMessage(content, 'server');
                }
            } catch (err) {
                console.error('parse error:', err);
            }
        };

        function appendMessage(content, type) {
            const div = document.createElement('div');
            div.className = type;
            if (type === 'server') {
                div.innerHTML = marked.parse(content);
            } else {
                div.textContent = content;
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        sendBtn.onclick = () => {
            const content = input.value.trim();
            if (!content || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'message.send',
                timestamp: Date.now(),
                payload: { content }
            }));

            appendMessage(content, 'user');
            input.value = '';
        };
    </script>

    <!-- Markdown rendering will be added in Phase 3 -->
</body>
</html>
